# SPDX-License-Identifier: CC0-1.0
#
# Licenzas dos ficheiros que non admiten cabeceira SPDX (ADR-0002).
# Se varias anotacións coinciden, gaña a última. Cabeceira no ficheiro > anotación.
version = 1

# Código e configuración sen comentarios (JSON, .nvmrc, listas de texto planas).
# Sen comodíns para binarios (png, ico, webp, woff2): unha fonte ou un icono adoita ser de
# terceiros; cada un anótase aquí, co seu titular e licenza reais, ao incorporalo (LIC-5).
[[annotations]]
path = [
  "**/*.json",
  "**/.nvmrc",
  "**/.mvn/jvm.config",
  "**/.mvn/maven.config",
  "scripts/allowed-licenses.txt",
  "scripts/license-exceptions.txt",
  "scripts/third-party-holders.txt",
  # Anacos que novo-modulo.sh insire noutros ficheiros: unha cabeceira acabaría dentro deles.
  "templates/module/fragments/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Santiago Herrero Padín e colaboradores de Furar"
SPDX-License-Identifier = "EUPL-1.2"

# Ficheiros esperados dos tests do calendario (.ics): iCalendar non admite comentarios.
[[annotations]]
path = ["api/src/test/resources/booking/calendar/*.ics"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Santiago Herrero Padín e colaboradores de Furar"
SPDX-License-Identifier = "EUPL-1.2"

# Textos da interface: citan «© IGN» (atribución de CartoCiudad que se mostra ao usuario), e
# reuse tomaríao por titular do ficheiro. A anotación manda sobre o contido (D02).
[[annotations]]
path = ["web/src/i18n/gl.json", "web/src/i18n/es.json"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Santiago Herrero Padín e colaboradores de Furar"
SPDX-License-Identifier = "EUPL-1.2"

# Datos de exemplo (demo): CC0.
[[annotations]]
path = [
  "api/src/main/resources/db/demo/**",
  "deploy/keycloak/demo/**",
  "deploy/keycloak/import-demo/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Santiago Herrero Padín e colaboradores de Furar"
SPDX-License-Identifier = "CC0-1.0"

