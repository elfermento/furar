path = ["api/src/main/resources/mail/shield.png"]
precedence = "override"
SPDX-FileCopyrightText = ["Google LLC", "2026 Santiago Herrero Padín e colaboradores de Furar"]
SPDX-License-Identifier = "Apache-2.0"

# Letra do tema de acceso de Keycloak: Atkinson Hyperlegible Next 5.3.0 (latin 400 e 700), os
# mesmos woff2 que usa a web desde o seu paquete npm, sen cambios; OFL-1.1.
[[annotations]]
path = [
  "deploy/keycloak/themes/furar/login/resources/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2",
  "deploy/keycloak/themes/furar/login/resources/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2",
]
precedence = "override"
SPDX-FileCopyrightText = "2020-2024 The Atkinson Hyperlegible Next Project Authors"
SPDX-License-Identifier = "OFL-1.1"

# Lista de contrasinais comúns do realm (passwordBlacklist): xerada para Furar a partir de patróns
# (secuencias de teclado e de díxitos, repeticións, palabras habituais en galego, castelán e inglés
# con números, anos e símbolos), só as de 12 caracteres ou máis. Keycloak le cada liña coma un
# contrasinal, así que non leva cabeceira.
[[annotations]]
path = ["deploy/keycloak/password-blacklists/furar-contrasinais-comuns.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Santiago Herrero Padín e colaboradores de Furar"
SPDX-License-Identifier = "CC0-1.0"
