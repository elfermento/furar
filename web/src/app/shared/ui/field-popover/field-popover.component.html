@if (look() === 'summary') {
  <span class="f-field-popover__heading" aria-hidden="true">{{ label() }}</span>
}
<button
  #trigger
  type="button"
  class="f-field-popover__trigger"
  aria-haspopup="dialog"
  [attr.id]="triggerId()"
  [attr.aria-label]="look() === 'filter' ? label() + ', ' + (value() || placeholder()) : null"
  [attr.aria-expanded]="expanded()"
  [attr.aria-controls]="expanded() ? panelId : null"
  [attr.aria-describedby]="describedBy()"
  [disabled]="disabled()"
  (click)="toggle()"
  (keydown)="onTriggerKeydown($event)"
>
  @if (look() === 'summary') {
    @if (icon(); as name) {
      <furar-icon class="f-field-popover__icon" [name]="name" />
    }
    <span class="f-field-popover__text">
      <span class="sr-only">{{ label() }}:</span>
      <span class="f-field-popover__value" [attr.data-empty]="value() ? null : ''">
        {{ value() || placeholder() }}
      </span>
      @if (detail()) {
        <span class="f-field-popover__detail">{{ detail() }}</span>
      }
    </span>
    <span class="f-field-popover__action">
      {{ action() }}
      <furar-icon name="chevron-down" class="f-field-popover__chevron" />
    </span>
  } @else if (look() === 'filter') {
    <span class="f-field-popover__value" [attr.data-empty]="value() ? null : ''">{{ value() || placeholder() }}</span>
  } @else {
    <span class="f-field-popover__text">
      <span class="f-field-popover__label"
        >{{ label() }}
        @if (required()) {
          <furar-required-mark />
        }
      </span>
      <span class="f-field-popover__value" [attr.data-empty]="value() ? null : ''">
        {{ value() || placeholder() }}
      </span>
    </span>
    <furar-icon name="chevron-down" class="f-field-popover__chevron" />
  }
</button>
<ng-template #panel>
  <div
    #panelElement
    class="f-field-popover__panel"
    role="dialog"
    tabindex="-1"
    [id]="panelId"
    [attr.aria-label]="label()"
    [attr.aria-modal]="sheet() || null"
    [attr.data-sheet]="sheet() || null"
    (keydown)="onPanelKeydown($event)"
  >
    @if (sheet()) {
      <div class="f-field-popover__head">
        <span class="f-field-popover__title" aria-hidden="true">{{ label() }}</span>
        <button
          type="button"
          furarButton="quiet"
          round
          data-close
          [attr.aria-label]="'ui.fieldPopover.close' | transloco: { label: label() }"
          (click)="close()"
        >
          <furar-icon name="close" />
        </button>
      </div>
    }
    <ng-content />
  </div>
</ng-template>
