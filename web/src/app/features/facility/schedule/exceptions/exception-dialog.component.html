@let t = 'facility.schedule.exceptions.';
<furar-dialog [heading]="heading()">
  <form class="gap-form grid" novalidate data-exception-form [id]="id" [formGroup]="form" (submit)="submit($event)">
    <furar-field [fieldId]="id + '-date'" [label]="t + 'date' | transloco" [error]="errors().date" required>
      <furar-date-field
        required
        formControlName="date"
        [buttonId]="id + '-date'"
        [label]="t + 'date' | transloco"
        [today]="today()"
        [invalid]="!!errors().date"
        [describedBy]="errors().date ? id + '-date-error' : null"
      />
    </furar-field>

    <furar-switch formControlName="open" [label]="t + 'open' | transloco" />

    <!-- As horas só existen co día aberto. -->
    @if (value().open) {
      <furar-field-group cells [style.--f-cell]="'8rem'" data-exception-hours>
        <furar-field [fieldId]="id + '-from'" [label]="'facility.schedule.seasonDialog.from' | transloco" required>
          <furar-time-picker
            required
            formControlName="startMinute"
            [buttonId]="id + '-from'"
            [max]="1425"
            [label]="t + 'from' | transloco"
          />
        </furar-field>
        <furar-field
          [fieldId]="id + '-to'"
          [label]="'facility.schedule.seasonDialog.to' | transloco"
          [error]="errors().interval"
          required
        >
          <furar-time-picker
            required
            formControlName="endMinute"
            allowEndOfDay
            [buttonId]="id + '-to'"
            [min]="15"
            [label]="t + 'to' | transloco"
            [invalid]="!!errors().interval"
            [describedBy]="errors().interval ? id + '-to-error' : null"
          />
        </furar-field>
      </furar-field-group>
    }

    @if (holidayName(); as name) {
      <furar-callout live="status" data-exception-holiday>
        <p>{{ t + 'holiday' | transloco: { name } }}</p>
      </furar-callout>
    }

    <furar-field
      [fieldId]="id + '-reason'"
      [label]="t + 'reason' | transloco"
      [tip]="t + 'reasonTip' | transloco"
      [error]="errors().reason"
    >
      <input
        furarInput
        formControlName="reason"
        autocomplete="off"
        [id]="id + '-reason'"
        [placeholder]="t + 'reasonHelp' | transloco"
        [attr.maxlength]="reasonMax"
        [attr.aria-invalid]="errors().reason ? 'true' : null"
        [attr.aria-describedby]="describedBy(id + '-reason', true, errors().reason)"
      />
    </furar-field>

    <furar-problem-alert [problem]="problem()" />
  </form>
  @if (data.exception) {
    <div class="f-dialog-danger">
      <furar-delete-button
        data-exception-delete
        [text]="t + 'delete.action' | transloco"
        [label]="t + 'delete.label' | transloco: { day: day() }"
        (pressed)="remove()"
      />
    </div>
  }
  <ng-container dialogActions>
    <button type="button" furarButton="quiet" data-exception-cancel (click)="ref.close()">
      {{ t + 'cancel' | transloco }}
    </button>
    <button type="submit" furarButton="primary" data-exception-apply [attr.form]="id">
      {{ 'facility.detail.edit.apply' | transloco }}
    </button>
  </ng-container>
</furar-dialog>
