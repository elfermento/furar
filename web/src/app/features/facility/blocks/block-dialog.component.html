@let t = 'facility.blocks.';
<furar-dialog [heading]="heading()">
  <form class="gap-form grid" novalidate data-block-form [id]="id" [formGroup]="form" (submit)="submit($event)">
    <furar-field [fieldId]="id + '-date'" [label]="t + 'date' | transloco" [error]="errors().date" required>
      <furar-date-field
        required
        formControlName="date"
        [buttonId]="id + '-date'"
        [label]="t + 'date' | transloco"
        [invalid]="!!errors().date"
        [describedBy]="errors().date ? id + '-date-error' : null"
      />
    </furar-field>

    <furar-field-group cells [style.--f-cell]="'8rem'" data-block-hours>
      <furar-field
        [fieldId]="id + '-from'"
        [label]="'facility.schedule.seasonDialog.from' | transloco"
        [tip]="t + 'hoursHelp' | transloco"
        required
      >
        <furar-time-picker
          required
          formControlName="startMinute"
          [buttonId]="id + '-from'"
          [label]="t + 'from' | transloco"
          [max]="lastStart"
          [describedBy]="id + '-from-help'"
        />
      </furar-field>
      <furar-field
        [fieldId]="id + '-to'"
        [label]="'facility.schedule.seasonDialog.to' | transloco"
        [error]="errors().period"
        required
      >
        <furar-time-picker
          required
          formControlName="endMinute"
          allowEndOfDay
          [buttonId]="id + '-to'"
          [min]="15"
          [label]="t + 'to' | transloco"
          [invalid]="!!errors().period"
          [describedBy]="errors().period ? id + '-to-error' : null"
        />
      </furar-field>
    </furar-field-group>

    <furar-field
      [fieldId]="id + '-reason'"
      [label]="t + 'reason' | transloco"
      [tip]="t + 'reasonTip' | transloco"
      [error]="errors().reason"
    >
      <input
        furarInput
        formControlName="reason"
        autocomplete="off"
        [id]="id + '-reason'"
        [placeholder]="t + 'reasonHelp' | transloco"
        [attr.maxlength]="reasonMax"
        [attr.aria-invalid]="errors().reason ? 'true' : null"
        [attr.aria-describedby]="describedBy(id + '-reason', true, errors().reason)"
      />
    </furar-field>

    <furar-problem-alert [problem]="problem()" />
  </form>
  @if (data.block) {
    <div class="f-dialog-danger">
      <furar-delete-button
        data-block-delete
        [text]="t + 'delete.action' | transloco"
        [label]="t + 'delete.label' | transloco: { when: when() }"
        (pressed)="remove()"
      />
    </div>
  }
  <ng-container dialogActions>
    <button type="button" furarButton="quiet" data-block-cancel (click)="ref.close()">
      {{ t + 'cancel' | transloco }}
    </button>
    <button type="submit" furarButton="primary" data-block-apply [attr.form]="id">
      {{ 'facility.detail.edit.apply' | transloco }}
    </button>
  </ng-container>
</furar-dialog>
