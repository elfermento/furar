#
# Tema de login de Furar: keycloak.v2 (PatternFly 5, accesible) co estilo da web (letra, cores,
# tarxeta e botóns, css/furar-tema.css) e textos en galego e castelán. Keycloak serve o tema
# baixo a súa versión e os navegadores que xa gardaran unha folla co mesmo nome non a volven
# pedir: se o tema cambia moito, cámbiase o nome da folla.
parent=keycloak.v2
import=common/keycloak
locales=gl,es
styles=css/styles.css css/furar-tema.css
darkMode=false
