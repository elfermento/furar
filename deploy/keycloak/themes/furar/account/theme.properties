#
# Consola da conta de Keycloak (keycloak.v3) con textos en galego e castelán.
parent=keycloak.v3
locales=gl,es
# Título da lapela (index.ftl usa properties.title, sen mensaxes por idioma; se non, «Account
# Management»): a marca do realm, igual en galego e en castelán.
title=Reservas deportivas
# Datas en galego cando o navegador non trae os datos de ICU de galego (Chrome): ver o ficheiro.
scripts=js/furar-datas-gl.js
# Logo da cabeceira: a marca do tema de acceso (o cadrado azul co escudo), no canto do de Keycloak.
logo=img/marca.svg
# Cabeceira e menú lateral claros coas cores do tema de acceso e da web.
styles=css/furar-consola.css
# Sempre claro, coma o tema de acceso (darkMode=false): o escuro do sistema rompía a cabeceira clara.
darkMode=false
