# SPDX-License-Identifier: EUPL-1.2
#
# CI pública de Furar (ADR-0016). Cada traballo chama a scripts/verificar.sh --parte X:
# a CI e o local executan os mesmos comandos (docs/definicion-de-feito.md).
# Check obrigatorio de main: só `ci-ok`. Actions fixadas por SHA (Renovate as actualiza).
# Etiqueta vX.Y.Z → corre todo, publica as imaxes que pasaron e2e con esa versión, asínaas
# (cosign, sen chaves) e crea a GitHub Release con furar-vX.Y.Z.env e os SBOM (OPS-2).
# Imaxes, sinatura e release SÓ no repositorio público (OPS-R4-2): no privado unha etiqueta
# corre compliance, api, web e e2e e nada máis (sen GHCR nin entrada en Rekor).
# Cada día ás 03:00 UTC, e2e sobre main se houbo commits nas últimas 25 h (OPS-R4-3).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CI: "true"
  FURAR_CI: "true"

jobs:
  changes:
    name: Que cambiou
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Etiqueta ou execución manual: todo, sen filtros.
      api: ${{ steps.todo.outputs.todo == 'true' || steps.filtro.outputs.api == 'true' }}
      web: ${{ steps.todo.outputs.todo == 'true' || steps.filtro.outputs.web == 'true' }}
      deploy: ${{ steps.todo.outputs.todo == 'true' || steps.filtro.outputs.deploy == 'true' }}
      docs: ${{ steps.todo.outputs.todo == 'true' || steps.filtro.outputs.docs == 'true' }}
      # Programado (OPS-R4-3): só e2e, e só se main cambiou desde o último.
      diario: ${{ steps.diario.outputs.diario == 'true' }}
    steps:
      - id: todo
        env:
          TODO: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        run: echo "todo=$TODO" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.todo.outputs.todo != 'true'
        with:
          persist-credentials: false
          # En push, paths-filter compara con github.event.before: precisa o historial (sen
          # credenciais non pode ir buscalo despois). '0' en texto porque o número 0 é falso.
          fetch-depth: ${{ github.event_name == 'push' && '0' || github.event_name == 'schedule' && 50 || 1 }}
      - id: diario
        if: github.event_name == 'schedule'
        run: |
          n=$(git log --oneline --since="25 hours ago" | wc -l)
          echo "commits nas últimas 25 h: $n"
          if [ "$n" -gt 0 ]; then echo diario=true; else echo diario=false; fi >>"$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: steps.todo.outputs.todo != 'true' && github.event_name != 'schedule'
        id: filtro
        with:
          filters: |
            api:
              - 'api/**'
            web:
              - 'web/**'
              - 'api/openapi.json'
            deploy:
              - 'deploy/**'
              - 'compose*.yaml'
              - 'scripts/**'
              - '.github/workflows/**'
              - '.dockerignore'
              - '.env.example'
              - 'docs/definicion-de-feito.md'
            docs:
              - 'docs/**'
              - '**/*.md'

  compliance:
    name: Licenzas, REUSE, segredos e SBOM
    # O programado só repite o e2e: compliance, api e web xa correron no push a main.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # D46 le o historial
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verificar.sh --parte compliance
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compliance
          path: |
            .verificar/logs/
            api/target/bom.json
            web/bom.json
          if-no-files-found: ignore
          retention-days: 30

  api:
    name: API (formato, tests, arquitectura)
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - run: scripts/verificar.sh --parte api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: api
          path: |
            .verificar/logs/
            api/target/surefire-reports/
            api/target/failsafe-reports/
            api/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  web:
    name: Web (lint, tests, build, cliente ao día, gardas)
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true' || needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: api/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: scripts/verificar.sh --parte web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web
          path: |
            .verificar/logs/
            web/coverage/
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (compose full + Playwright + axe)
    needs: [changes, api, web]
    # OPS-R3-1: mentres o repositorio é privado, o e2e non corre en cada push a main (minutos de
    # Actions); corre nos PR, nas etiquetas, a man e cada noite sobre main se houbo commits
    # (OPS-R4-3: sen protección de rama no plan Free, unha regresión vese en < 24 h).
    # Antes de etiquetar, en local: scripts/verificar.sh --estrito.
    if: >-
      always()
      && (github.event_name != 'push' || github.ref_type == 'tag')
      && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.deploy == 'true' || needs.changes.outputs.diario == 'true')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Enderezos sen rede (Narón e Ferrol gardados): o e2e non chama a CartoCiudad (ADR-0023, D1-25).
      FURAR_GEOCODER: fixed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      # age (BSD-3-Clause): D41 proba tamén as copias cifradas (OPS-7).
      # Coa lista de apt da imaxe do runner, o install pode dar 404 (OPS-R3-5).
      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends age
      - name: Versión das imaxes (etiquetas OCI)
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then v=$GITHUB_REF_NAME; else v="main-${GITHUB_SHA::12}"; fi
          { echo "FURAR_VERSION=$v"; echo "FURAR_REVISION=$GITHUB_SHA"; } >>"$GITHUB_ENV"
      - run: scripts/verificar.sh --parte e2e
      # As imaxes que pasaron e2e son as que se publican (OPS-5): non se reconstrúen.
      - name: Gardar as imaxes verificadas
        if: success() && github.event.repository.visibility == 'public' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        run: docker save furar-api:local furar-web:local furar-keycloak:local | zstd -T0 -3 -o imaxes-verificadas.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && github.event.repository.visibility == 'public' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
        with:
          name: imaxes-verificadas
          path: imaxes-verificadas.tar.zst
          compression-level: 0
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e
          path: |
            .verificar/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  images:
    name: Imaxes (Trivy, SBOM, sinatura, GHCR)
    needs: [changes, compliance, api, web, e2e]
    # Só no repositorio PÚBLICO (OPS-R4-2): no privado, GHCR privado ten 500 MB e cosign sen
    # chaves deixaría en Rekor (público e permanente) a identidade do repo privado. Alí, nas
    # etiquetas v* e a man desde main; corre todo sen filtros e todo ten que dar success;
    # publícanse as imaxes que pasaron o e2e (T4, OPS-5).
    if: >-
      always()
      && github.event.repository.visibility == 'public'
      && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
      && needs.compliance.result == 'success'
      && needs.api.result == 'success'
      && needs.web.result == 'success'
      && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write # cosign sen chaves (OIDC de GitHub → Sigstore)
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imaxes-verificadas
      - name: Cargar as imaxes que pasaron e2e
        run: zstd -dc imaxes-verificadas.tar.zst | docker load && rm imaxes-verificadas.tar.zst
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Acceso a GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: version
        run: |
          if [[ $GITHUB_REF_TYPE == tag ]]; then v=$GITHUB_REF_NAME; else v="main-${GITHUB_SHA::12}"; fi
          echo "version=$v" >>"$GITHUB_OUTPUT"
      - name: Escanear, publicar e asinar en serie
        env:
          FURAR_VERSION: ${{ steps.version.outputs.version }}
        run: |
          export FURAR_REGISTRY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          scripts/publicar-imaxes.sh "$FURAR_VERSION" --publicar --sen-construir --asinar
          cat .verificar/imaxes/furar-*.env >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imaxes
          path: .verificar/imaxes/
          retention-days: 90

  release:
    name: GitHub Release
    needs: images
    if: github.ref_type == 'tag' && github.event.repository.visibility == 'public' && needs.images.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historia e etiquetas: notas-release.sh compara o realm coa release anterior (OPS-R2-3).
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: imaxes
          path: imaxes
      - name: Crear a release (permanente e pública) con furar-VERSIÓN.env e os SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.images.outputs.version }}
        run: scripts/notas-release.sh "$VERSION" imaxes >notas.md && gh release create "$VERSION" imaxes/* --verify-tag --title "Furar $VERSION" --notes-file notas.md

  ci-ok:
    name: ci-ok
    needs: [changes, compliance, api, web, e2e, images, release]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todos os traballos pasaron ou non tocaban
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for r in $RESULTADOS; do
            case "$r" in success|skipped) ;; *) echo "::error::un traballo rematou en $r"; exit 1 ;; esac
          done
