# Textos de los errores del módulo customfields (ADR-0008, ADR-0005 ARQ3-2).

problem.customfield.definition-not-found.title=Campo no encontrado
problem.customfield.definition-not-found.detail=No existe ese campo personalizado en este ayuntamiento.
problem.customfield.code-taken.title=Código en uso
problem.customfield.code-taken.detail=Ya hay un campo con el código «{code}».
problem.customfield.code-invalid.title=Código no válido
problem.customfield.code-invalid.detail=El código debe empezar por letra y tener de 2 a 40 letras minúsculas, dígitos o guiones bajos.
problem.customfield.code-reserved.title=Código reservado
problem.customfield.code-reserved.detail=«{code}» es un campo propio de la aplicación y no se puede usar.
problem.customfield.invalid-definition.title=Definición no válida
problem.customfield.invalid-definition.detail=La configuración del campo no es coherente ({reason}).
problem.customfield.personal-data-public.title=Un dato personal no puede ser público
problem.customfield.personal-data-public.detail=Los campos marcados como dato personal solo los pueden ver el titular y el personal. Cambia la visibilidad o quita la marca.
problem.customfield.limit-exceeded.title=Límite superado
problem.customfield.limit-exceeded.detail=Se superó el límite de campos personalizados ({limit}).
problem.customfield.required.title=Campo obligatorio
problem.customfield.required.detail=Este campo es obligatorio.
problem.customfield.invalid-type.title=Tipo no válido
problem.customfield.invalid-type.detail=El valor no es del tipo esperado.
problem.customfield.too-short.title=Texto demasiado corto
problem.customfield.too-short.detail=Escribe al menos {min} caracteres.
problem.customfield.too-long.title=Texto demasiado largo
problem.customfield.too-long.detail=Escribe como máximo {max} caracteres.
problem.customfield.invalid-format.title=Formato no válido
problem.customfield.invalid-format.detail=El valor no tiene el formato esperado ({format}).
problem.customfield.below-min.title=Valor demasiado bajo
problem.customfield.below-min.detail=El valor mínimo es {min}.
problem.customfield.above-max.title=Valor demasiado alto
problem.customfield.above-max.detail=El valor máximo es {max}.
problem.customfield.too-many-decimals.title=Demasiados decimales
problem.customfield.too-many-decimals.detail=Se admiten como máximo {decimals} decimales.
problem.customfield.invalid-date.title=Fecha no válida
problem.customfield.invalid-date.detail=Escribe una fecha válida (AAAA-MM-DD).
problem.customfield.date-too-early.title=Fecha anterior a la permitida
problem.customfield.date-too-early.detail=La fecha debe ser {min} o posterior.
problem.customfield.date-too-late.title=Fecha posterior a la permitida
problem.customfield.date-too-late.detail=La fecha debe ser {max} o anterior.
problem.customfield.invalid-option.title=Opción no válida
problem.customfield.invalid-option.detail=La opción «{option}» no está disponible.
problem.customfield.too-few-options.title=Pocas opciones
problem.customfield.too-few-options.detail=Elige al menos {min} opciones.
problem.customfield.too-many-options.title=Demasiadas opciones
problem.customfield.too-many-options.detail=Elige como máximo {max} opciones.
problem.customfield.duplicate-option.title=Opción repetida
problem.customfield.duplicate-option.detail=No repitas la misma opción.
problem.customfield.unknown-field.title=Campo desconocido
problem.customfield.unknown-field.detail=Este campo no existe en este ayuntamiento.
problem.customfield.inactive-field.title=Campo desactivado
problem.customfield.inactive-field.detail=Este campo está desactivado y no se puede cambiar.
problem.customfield.single-usage.title=Un campo, un sitio
problem.customfield.single-usage.detail=Cada campo se usa en un solo sitio (ayuntamiento, instalación o reserva). Para pedirlo en otro, crea otro campo.
problem.customfield.visibility-not-allowed.title=Visibilidad no permitida
problem.customfield.visibility-not-allowed.detail=Los campos de la reserva solo los ven la persona que reserva y el personal.
problem.customfield.target-has-values.title=No se puede cambiar de sitio
problem.customfield.target-has-values.detail=El campo ya tiene valores guardados: no se puede cambiar de sitio.
problem.customfield.has-values.title=No se puede eliminar
problem.customfield.has-values.detail=El campo tiene datos guardados y no se puede eliminar. Puedes desactivarlo: deja de pedirse y los datos se conservan.
problem.customfield.option-has-values.title=No se puede eliminar la opción
problem.customfield.option-has-values.detail=La opción «{option}» tiene datos guardados y no se puede eliminar. Puedes desactivarla.
