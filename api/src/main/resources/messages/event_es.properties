problem.event.attendance-too-early.title=Aún es pronto
problem.event.attendance-too-early.detail=La lista se pasa desde poco antes de que empiece la sesión.
problem.event.attendance-invalid.title=Persona no encontrada
problem.event.attendance-invalid.detail=Esa persona no tiene plaza en esta actividad.
problem.event.birth-years-invalid.title=Años no válidos
problem.event.birth-years-invalid.detail=Los años de nacimiento van de {min} a {max} y el primero no puede ser posterior al segundo.
problem.event.birth-year-required.title=Falta la fecha de nacimiento
problem.event.birth-year-required.detail=Este evento tiene límite de edad: indica la fecha de nacimiento.
problem.event.birth-date-invalid.title=Fecha de nacimiento no válida
problem.event.birth-date-invalid.detail=La fecha de nacimiento tiene que ser pasada y desde 1900.
problem.event.age-not-allowed.title=Fuera de la edad
problem.event.age-not-allowed.detail=Ese año de nacimiento no entra en la edad de este evento.
problem.event.dependent-not-found.title=Persona no encontrada
problem.event.dependent-not-found.detail=Esa persona no está entre tus personas a cargo.
problem.event.waitlist-limit.title=Demasiadas esperas
problem.event.waitlist-limit.detail=Ya estás en {max} listas de espera. Sal de alguna para entrar en otra.
problem.event.not-notified.title=Sin aviso de plaza
problem.event.not-notified.detail=No tienes ningún aviso de plaza libre en este evento.
