# Textos dos erros do módulo event (ADR-0008, ADR-0005; ADR-0038).

problem.event.not-found.title=Evento no encontrado
problem.event.not-found.detail=No existe ese evento en este ayuntamiento.
problem.event.name-invalid.title=Nombre no válido
problem.event.name-invalid.detail=El nombre es obligatorio en gallego y en castellano y tiene como máximo {max} caracteres.
problem.event.description-invalid.title=Descripción no válida
problem.event.description-invalid.detail=Si hay descripción, va en gallego y en castellano, de hasta {max} caracteres cada una.
problem.event.place-invalid.title=Lugar no válido
problem.event.place-invalid.detail=Elige una instalación o escribe otro sitio (hasta {max} caracteres).
problem.event.facility-not-found.title=Instalación no encontrada
problem.event.facility-not-found.detail=No existe esa instalación en este ayuntamiento.
problem.event.capacity-invalid.title=Plazas no válidas
problem.event.capacity-invalid.detail=Las plazas van de 1 a {max}; vacío, sin límite.
problem.event.price-invalid.title=Precio no válido
problem.event.price-invalid.detail=El precio va de 0,01 a {max} €; vacío, gratis.
problem.event.deadline-invalid.title=Fecha límite no válida
problem.event.deadline-invalid.detail=«Apuntarse hasta» no puede ser después de que empiece el evento.
problem.event.starts-in-past.title=Fecha pasada
problem.event.starts-in-past.detail=La fecha y la hora del evento tienen que ser futuras.
problem.event.capacity-below-registered.title=Menos plazas que apuntadas
problem.event.capacity-below-registered.detail=Ya hay más personas apuntadas que las plazas que pusiste.
problem.event.cancelled.title=Evento cancelado
problem.event.cancelled.detail=El evento está cancelado: no se puede cambiar ni apuntarse.
problem.event.started.title=Evento empezado
problem.event.started.detail=El evento ya empezó: no se puede cambiar ni cancelar.
problem.event.has-registrations.title=Hay personas apuntadas
problem.event.has-registrations.detail=Con personas apuntadas o pidiendo plaza no se elimina: cancélalo y las avisaremos.
problem.event.closed.title=Inscripción cerrada
problem.event.closed.detail=Ya no te puedes apuntar ni desapuntar de este evento.
problem.event.full.title=Evento completo
problem.event.full.detail=Ya no quedan plazas.
problem.event.already-registered.title=Ya estás apuntado
problem.event.already-registered.detail=Ya tienes plaza o ya la pediste en este evento.
problem.event.not-registered.title=No estás apuntado
problem.event.not-registered.detail=No tienes plaza ni la pediste en este evento.
problem.event.registration-not-found.title=Persona no encontrada
problem.event.registration-not-found.detail=Esa persona no está en este evento.
problem.event.not-pending.title=Solicitud ya decidida
problem.event.not-pending.detail=Esa solicitud ya se aceptó o se rechazó.
problem.event.no-payment.title=Sin pago
problem.event.no-payment.detail=Solo se marca el pago de una persona con plaza en un evento con precio.
# Actividades con horario (ADR-0041).
problem.event.schedule-invalid.title=Horario no válido
problem.event.schedule-invalid.detail=Una actividad con horario lleva días, horas y fechas; en una instalación, también el uso.
problem.event.schedule-weekdays-required.title=Faltan los días
problem.event.schedule-weekdays-required.detail=Elige al menos un día de la semana.
problem.event.schedule-time-invalid.title=Horas no válidas
problem.event.schedule-time-invalid.detail=Las horas van de 15 en 15 minutos y la de fin es después de la de inicio.
problem.event.schedule-range-invalid.title=Fechas no válidas
problem.event.schedule-range-invalid.detail=Las fechas van desde hoy y como mucho un año.
problem.event.kind-not-editable.title=El tipo no se cambia
problem.event.kind-not-editable.detail=Un evento de un día no pasa a tener horario ni al revés: crea otro.
problem.event.schedule-not-editable.title=El horario no se cambia
problem.event.schedule-not-editable.detail=El horario, las fechas y el lugar de una actividad no se cambian: termínala y crea otra.
problem.event.no-sessions.title=Sin sesiones
problem.event.no-sessions.detail=Con ese horario no queda ningún día libre.
