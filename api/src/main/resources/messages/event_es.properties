problem.event.sessions-changed.detail=Mientras tanto ha cambiado algún día. Revisa los choques y vuelve a crear.
problem.event.ended.title=Actividad terminada
problem.event.ended.detail=La actividad ya ha terminado: no se puede cambiar ni cancelar.
problem.event.not-scheduled.title=No tiene horario
problem.event.not-scheduled.detail=Esto solo se hace en una actividad con horario.
problem.event.end-invalid.title=Día no válido
problem.event.end-invalid.detail=Elige un día desde hoy y dentro de las fechas de la actividad.
problem.event.session-not-found.title=Sesión no encontrada
problem.event.session-not-found.detail=Esa sesión no es de esta actividad.
problem.event.session-cancelled.title=Sesión cancelada
problem.event.session-cancelled.detail=Esa sesión ya está cancelada.
problem.event.session-started.title=Sesión empezada
problem.event.session-started.detail=La sesión ya ha empezado: no se puede cancelar.
problem.event.session-has-attendance.title=Lista ya pasada
