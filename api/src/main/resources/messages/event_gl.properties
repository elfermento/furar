problem.event.capacity-invalid.title=Prazas non válidas
problem.event.capacity-invalid.detail=As prazas van de 1 a {max}; baleiro, sen límite.
problem.event.price-invalid.title=Prezo non válido
problem.event.price-invalid.detail=O prezo vai de 0,01 a {max} €; baleiro, gratis.
problem.event.deadline-invalid.title=Data límite non válida
problem.event.deadline-invalid.detail=«Apuntarse ata» non pode ser despois de que empece o evento.
problem.event.starts-in-past.title=Data pasada
