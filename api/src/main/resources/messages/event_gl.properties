problem.event.cancelled.title=Evento cancelado
problem.event.cancelled.detail=O evento está cancelado: non se pode cambiar nin apuntarse.
problem.event.started.title=Evento empezado
problem.event.started.detail=O evento xa empezou: non se pode cambiar nin cancelar.
problem.event.has-registrations.title=Hai persoas apuntadas
problem.event.has-registrations.detail=Con persoas apuntadas ou pedindo praza non se elimina: cancélao e avisarémolas.
problem.event.closed.title=Inscrición pechada
problem.event.closed.detail=Xa non se pode apuntar nin desapuntar deste evento.
problem.event.full.title=Evento completo
problem.event.full.detail=Xa non quedan prazas.
problem.event.already-registered.title=Xa estás apuntada
problem.event.already-registered.detail=Xa tes praza ou xa a pediches neste evento.
problem.event.not-registered.title=Non estás apuntada
