problem.event.registration-not-found.detail=Esa persoa non está neste evento.
problem.event.not-pending.title=Solicitude xa decidida
problem.event.not-pending.detail=Esa solicitude xa se aceptou ou se rexeitou.
problem.event.no-payment.title=Sen pago
problem.event.no-payment.detail=Só se marca o pago dunha persoa con praza nun evento con prezo.
# Actividades con horario (ADR-0041).
problem.event.schedule-invalid.title=Horario non válido
problem.event.schedule-invalid.detail=Unha actividade con horario leva días, horas e datas; nunha instalación, tamén o uso.
problem.event.schedule-weekdays-required.title=Faltan os días
problem.event.schedule-weekdays-required.detail=Escolle polo menos un día da semana.
