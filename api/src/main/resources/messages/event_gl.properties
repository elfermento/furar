problem.event.attendance-invalid.detail=Esa persoa non ten praza nesta actividade.
problem.event.birth-years-invalid.title=Anos non válidos
problem.event.birth-years-invalid.detail=Os anos de nacemento van de {min} a {max} e o primeiro non pode ser despois do segundo.
problem.event.birth-year-required.title=Falta a data de nacemento
problem.event.birth-year-required.detail=Este evento ten límite de idade: indica a data de nacemento.
problem.event.birth-date-invalid.title=Data de nacemento non válida
