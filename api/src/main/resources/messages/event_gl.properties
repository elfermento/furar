problem.event.schedule-time-invalid.detail=As horas van de 15 en 15 minutos e a de fin é despois da de inicio.
problem.event.schedule-range-invalid.title=Datas non válidas
problem.event.schedule-range-invalid.detail=As datas van desde hoxe e como moito un ano.
