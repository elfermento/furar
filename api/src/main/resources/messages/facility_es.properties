# Textos de los errores del módulo facility (ADR-0008, ADR-0005 ARQ3-2).

problem.facility.not-found.title=Instalación no encontrada
problem.facility.not-found.detail=No existe esa instalación en este ayuntamiento.
problem.facility.name-invalid.title=Nombre no válido
problem.facility.name-invalid.detail=El nombre es obligatorio y tiene como máximo {max} caracteres.
problem.facility.name-taken.title=Nombre repetido
problem.facility.name-taken.detail=Ya hay una instalación llamada «{name}» en este ayuntamiento.
problem.facility.address-required.title=Falta la dirección
problem.facility.address-required.detail=Indica la vía, el código postal, la localidad, el código INE y el punto en el mapa.
problem.facility.address-invalid.title=Dirección no válida
problem.facility.address-invalid.detail=Revisa los campos marcados de la dirección.
problem.facility.affected-bookings.title=Hay reservas afectadas
problem.facility.affected-bookings.detail=Este cambio afecta a {count} reservas futuras: decide qué hacer con cada una.
problem.facility.decision-invalid.title=Decisión incompleta
problem.facility.decision-invalid.detail=Para cancelar una reserva elige al menos una forma de avisar; si se mantiene, no se avisa.
problem.facility.details-invalid.title=Datos no válidos
problem.facility.details-invalid.detail=Revisa los campos marcados de la tarjeta Datos.
problem.facility.booking-mode-invalid.title=Reserva por internet o huecos libres
problem.facility.booking-mode-invalid.detail=Los huecos libres solo se muestran si los vecinos no reservan por internet.
problem.facility.description-invalid.title=Descripción incompleta
problem.facility.description-invalid.detail=Escribe la descripción en gallego y en castellano, de hasta {max} caracteres cada una.
problem.facility.house-rules-invalid.title=Normas de la instalación incompletas
problem.facility.house-rules-invalid.detail=Escribe las normas de la instalación en gallego y en castellano, de hasta {max} caracteres cada una.
problem.facility.sport-unknown.title=Deporte desconocido
problem.facility.sport-unknown.detail=Ese deporte no está en el catálogo ni entre los del ayuntamiento.
problem.facility.sport-duplicated.title=Deporte repetido
problem.facility.sport-duplicated.detail=La instalación ya tiene ese deporte.
problem.facility.sport-name-taken.title=Deporte repetido
problem.facility.sport-name-taken.detail=Ya hay un deporte llamado «{name}» en este ayuntamiento.
problem.facility.sport-name-invalid.title=Nombre del deporte no válido
problem.facility.sport-name-invalid.detail=Escribe el nombre en gallego y en castellano, de hasta {max} caracteres.
problem.facility.photo-not-found.title=Foto no encontrada
problem.facility.photo-not-found.detail=Esa foto no está en la biblioteca de este ayuntamiento.
problem.facility.photo-too-large.title=Foto demasiado grande
problem.facility.photo-too-large.detail=La foto puede tener como máximo {max}.
problem.facility.photo-too-many-pixels.title=Foto con demasiados píxeles
problem.facility.photo-too-many-pixels.detail=La foto puede tener como máximo {max} megapíxeles. Redúcela y vuelve a subirla.
problem.facility.photo-unsupported-type.title=Formato no admitido
problem.facility.photo-unsupported-type.detail=Sube la foto en JPEG o PNG.
problem.facility.photo-unreadable.title=No se puede leer la foto
problem.facility.photo-unreadable.detail=El archivo está dañado o en un formato que no se puede leer. Guárdalo otra vez como JPEG o PNG.
problem.facility.photo-limit.title=Más de {max} imágenes
problem.facility.photo-limit.detail=Una instalación puede tener como máximo {max} imágenes. Quita alguna antes de añadir otra.
problem.facility.photo-alt-invalid.title=Falta el texto alternativo
problem.facility.photo-alt-invalid.detail=Describe la foto en gallego y en castellano, con hasta {max} caracteres.
problem.facility.images-invalid.title=Las imágenes han cambiado
problem.facility.images-invalid.detail=Hay una imagen repetida, una foto que ya no está en la biblioteca o un dibujo que no existe. Recarga la ficha y vuelve a elegirlas.
problem.facility.photo-not-pending.title=La foto ya está en la biblioteca
problem.facility.photo-not-pending.detail=Solo se puede descartar una foto recién subida que aún no se ha guardado.
problem.facility.has-bookings.title=La instalación tiene reservas
problem.facility.has-bookings.detail=Ha tenido reservas: para conservar el historial, dala de baja en vez de eliminarla.
problem.facility.not-publishable.title=Todavía no se puede publicar
problem.facility.not-publishable.detail=Para publicarla hace falta la dirección, al menos un deporte, al menos un uso y el horario.
