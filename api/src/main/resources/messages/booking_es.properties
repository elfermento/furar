# Textos de los errores del módulo booking (ADR-0008, ADR-0005 ARQ3-2; plan del dominio 2, §2.2).

problem.booking.not-found.title=Reserva no encontrada
problem.booking.not-found.detail=No existe esa reserva.
problem.booking.facility-not-bookable.title=No se puede reservar
problem.booking.facility-not-bookable.detail=Esta instalación no se reserva por internet.
problem.booking.use-not-available.title=No disponible
problem.booking.use-not-available.detail=Esto no se puede reservar ese día.
problem.booking.slot-invalid.title=Hora no válida
problem.booking.slot-invalid.detail=Esa hora no está disponible. Elige una de las horas libres.
problem.booking.slot-taken.title=Hora ya ocupada
problem.booking.slot-taken.detail=Alguien acaba de reservar esa hora. Elige otra.
problem.booking.part-taken.title=Parte ya ocupada
problem.booking.part-taken.detail=Esa parte ya está reservada a esa hora. Elige otra.
problem.booking.seat-taken-by-you.title=Ya tienes plaza
problem.booking.seat-taken-by-you.detail=Ya tienes una plaza reservada a esa hora.
problem.booking.too-soon.title=Demasiado pronto
problem.booking.too-soon.detail=Esa hora ya ha empezado o está demasiado cerca. Elige otra más adelante.
problem.booking.too-far.title=Demasiado lejos
problem.booking.too-far.detail=Solo se puede reservar con {days} días de antelación como máximo.
problem.booking.too-long.title=Demasiado larga
problem.booking.too-long.detail=Como máximo, {max} franjas seguidas.
problem.booking.cap-reached.title=Límite de reservas
problem.booking.cap-reached.detail=Ya tienes {count} reservas en este periodo, el máximo para esto.
problem.booking.cancel-deadline-passed.title=Fuera de plazo
problem.booking.cancel-deadline-passed.detail=Ya ha pasado el plazo para cancelar o cambiar esta reserva.
problem.booking.not-cancellable.title=Reserva cancelada
problem.booking.not-cancellable.detail=Esta reserva ya está cancelada.
problem.booking.change-other-facility.title=Otra instalación
problem.booking.change-other-facility.detail=Solo se puede cambiar dentro de la misma instalación. Para otra, cancela y reserva de nuevo.
problem.booking.change-price-paid.title=Precio distinto
problem.booking.change-price-paid.detail=Para cambiar a un precio distinto, cancela y reserva de nuevo.
problem.booking.payment-transition-invalid.title=Cambio de pago no válido
problem.booking.payment-transition-invalid.detail=El pago de esta reserva no puede pasar a ese estado.
problem.booking.staff-account.title=Cuenta de trabajo
problem.booking.staff-account.detail=Esta es una cuenta de trabajo; para reservar usa tu cuenta personal.
problem.booking.affected-needs-manager.title=Afecta a reservas
problem.booking.affected-needs-manager.detail=Este cambio afecta a {count} reservas futuras. Solo la gestión del ayuntamiento puede decidir qué hacer con ellas.
problem.booking.idempotency-key-missing.title=Falta la clave de reintento
problem.booking.idempotency-key-missing.detail=Para reservar hay que enviar la cabecera Idempotency-Key.
problem.booking.idempotency-key-invalid.title=Clave de reintento no válida
problem.booking.idempotency-key-invalid.detail=La cabecera Idempotency-Key tiene que tener entre 1 y {max} caracteres ASCII visibles, sin comillas.
problem.booking.idempotency-key-reused.title=Clave ya usada
problem.booking.idempotency-key-reused.detail=Esta clave de reintento ya se usó para otra reserva. Vuelve a elegir la hora y confirma de nuevo.
problem.booking.export-range-too-long.title=Periodo demasiado largo
problem.booking.export-range-too-long.detail=Como máximo, {months} meses. Elige un periodo más corto.
problem.booking.holder-not-editable.title=Datos de la cuenta
problem.booking.holder-not-editable.detail=Esta reserva se hizo con la cuenta de la persona: el nombre y el correo son los de la cuenta y no se cambian aquí.
