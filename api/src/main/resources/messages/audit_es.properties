# Textos dos erros do rexistro de actividade (ADR-0008, ADR-0020; plan do dominio 4, §2.3).

problem.audit.range-invalid.title=Periodo no válido
problem.audit.range-invalid.detail=El periodo tiene que empezar antes de terminar y durar como máximo {maxDays} días.
problem.audit.export-reference-invalid.title=Referencia no válida
problem.audit.export-reference-invalid.detail=Indica la referencia del expediente o de las diligencias, con {max} caracteres como máximo.
problem.audit.export-not-blocked.title=Periodo sin eventos bloqueados
problem.audit.export-not-blocked.detail=En el periodo elegido no hay eventos bloqueados: solo se exportan los que ya no se ven en el registro y todavía se guardan.
problem.audit.export-too-large.title=Demasiados eventos
problem.audit.export-too-large.detail=El periodo tiene más de {maxRows} eventos: elige un periodo más corto.
