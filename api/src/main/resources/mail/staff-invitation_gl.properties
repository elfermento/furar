#
# Textos do correo da invitación ao persoal en galego (plan do dominio 4, D4-06; ADR-0027). Mesmas
# claves en staff-invitation_es.properties (StaffInvitationMailComposerTest). {0}, {1}: valores,
# sempre escapados. O nome do concello vai xa coa preposición («de Narón», «da Coruña»,
# PlaceName). Sen apóstrofos: os textos con valores pasan por MessageFormat.

from=Deportes {0}
band.service=Deportes municipais
# Asunto e preheader segundo o rol (Xestión ou Recepción).
subject.MANAGER={0} invítate a xestionar as instalacións deportivas do Concello {1}
subject.STAFF={0} invítate a atender as reservas das instalacións deportivas do Concello {1}
preheader.MANAGER={0} invítate a xestionar as instalacións deportivas {1}
preheader.STAFF={0} invítate a atender as reservas das instalacións deportivas do Concello {1}
title=Crea a túa conta
lead.MANAGER={0} invítate a rexistrarte co rol Xestión para xestionar as instalacións deportivas e as súas reservas do Concello {1}.
lead.STAFF={0} invítate a rexistrarte co rol Recepción para atender as reservas das instalacións deportivas do Concello {1}.
inviter.fallback=A xestión {0}
expires.at={0} {2,choice,0#ás|1#á|1<ás} {1} (hora de Galicia)
button=Crear a miña conta
copy=Non funciona o botón? Abre esta ligazón:
use=Usa este mesmo correo ({0}). A ligazón serve unha vez e caduca o {1}.
ignore=Se non o esperabas, ignora este correo.
footer.why=Recibes este correo porque te invitaron á plataforma de xestión das instalacións deportivas do Concello {0}.
# Primeira comunicación co persoal (RGPD art. 14): quen trata os datos e para que; o resto, na
# sección «Persoal do concello» da páxina de privacidade.
footer.privacyNote=O Concello {0} trata os teus datos para xestionar a túa conta de traballo.
footer.privacy=Privacidade
