#
# Textos dos correos das incidencias en galego (ADR-0036). Mesmas claves en incident_es.properties
# (IncidentMailTemplatesTest). {0}, {1}: valores, sempre escapados. O nome do concello vai xa coa
# preposición («de Narón», PlaceName). Sen apóstrofos: os textos con valores pasan por MessageFormat.

from=Deportes {0}
band.service=Deportes municipais
when={0} {2,choice,0#ás|1#á|1<ás} {1}
type.BREAKDOWN=avaría
type.CLEANING=limpeza
type.SAFETY=seguridade
type.OTHER=outro problema
# Á xestión do concello, cando entra unha nova.
reported.subject=Nova incidencia: {0}
reported.preheader=Avisaron dun problema ({0}) en {1}.
reported.title=Nova incidencia
reported.lead=Avisaron dun problema en {0} ({1}, o {2}).
reported.button=Ver as incidencias
reported.why=Recibes este correo porque xestionas as instalacións deportivas do Concello {0}.
# Á persoa que avisou, cando se resolve.
resolved.subject=Resolvemos o teu aviso: {0}
resolved.preheader=O teu aviso sobre {0} está resolto.
resolved.title=Resolvemos o teu aviso
resolved.hello=Ola:
resolved.helloName=Ola, {0}:
resolved.lead=O teu aviso sobre {0} ({1}, enviado o {2}) está resolto.
resolved.messageLabel=Mensaxe do concello:
resolved.why=Recibes este correo porque avisaches dun problema nas instalacións deportivas do Concello {0}.
