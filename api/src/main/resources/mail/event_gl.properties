# Textos dos correos dos eventos do concello en galego (ADR-0038). Mesmas claves en
# event_es.properties (EventMailTemplatesTest). {0}: o evento; {1}: cando; {2}: onde. Sempre
# escapados. Sen apóstrofos: os textos con valores pasan por MessageFormat.

from=Deportes {0}
band.service=Deportes municipais
when={0} {2,choice,0#ás|1#á|1<ás} {1}
hello=Ola:
helloName=Ola, {0}:
button=Ver o evento
why=Recibes este correo porque te apuntaches a un evento deportivo do Concello {0}.
# A solicitude dun evento con aprobación.
accepted.subject=Tes praza: {0}
accepted.preheader=O concello aceptou a túa solicitude para {0}.
accepted.title=Tes praza
accepted.lead=O concello aceptou a túa solicitude: tes praza en {0}, o {1}, en {2}.
rejected.subject=Non puidemos darche praza: {0}
rejected.preheader=O concello non aceptou a túa solicitude para {0}.
rejected.title=Non puidemos darche praza
rejected.lead=O concello non aceptou a túa solicitude para {0} ({1}, {2}).
# Avisos a todas as persoas apuntadas.
moved.subject=Cambiou o evento: {0}
moved.preheader={0} ten nova data, hora ou lugar.
moved.title=O evento cambiou
moved.lead={0} cambiou de data, hora ou lugar. Agora é o {1}, en {2}. Segues apuntada ou apuntado.
cancelled.subject=Cancelamos o evento: {0}
cancelled.preheader={0} non se vai celebrar.
cancelled.title=Cancelamos o evento
cancelled.lead=O concello cancelou {0}, que ía ser o {1}, en {2}.
