# Textos del correo de la invitación al personal en castellano (plan do dominio 4, D4-06;
# ADR-0027). Mismas claves que staff-invitation_gl.properties (StaffInvitationMailComposerTest).
# El nombre del ayuntamiento va ya con la preposición («de Narón», PlaceName). Sin apóstrofos:
# los textos con valores pasan por MessageFormat.

from=Deportes {0}
band.service=Deportes municipales
# Asunto y preheader según el rol (Gestión o Recepción).
subject.MANAGER={0} te invita a gestionar las instalaciones deportivas del Concello {1}
subject.STAFF={0} te invita a atender las reservas de las instalaciones deportivas del Concello {1}
preheader.MANAGER={0} te invita a gestionar las instalaciones deportivas {1}
preheader.STAFF={0} te invita a atender las reservas de las instalaciones deportivas del Concello {1}
title=Crea tu cuenta
lead.MANAGER={0} te invita a registrarte con el rol Gestión para gestionar las instalaciones deportivas y sus reservas del Concello {1}.
lead.STAFF={0} te invita a registrarte con el rol Recepción para atender las reservas de las instalaciones deportivas del Concello {1}.
inviter.fallback=La gestión {0}
expires.at={0} {2,choice,0#a las|1#a la|1<a las} {1} (hora de Galicia)
button=Crear mi cuenta
copy=¿El botón no funciona? Abre este enlace:
use=Usa este mismo correo ({0}). El enlace sirve una vez y caduca el {1}.
ignore=Si no lo esperabas, ignora este correo.
footer.why=Recibes este correo porque te han invitado a la plataforma de gestión de instalaciones deportivas del Concello {0}.
# Primera comunicación con el personal (RGPD art. 14): quién trata los datos y para qué; el resto,
# en la sección «Personal del ayuntamiento» de la página de privacidad.
footer.privacyNote=El Concello {0} trata tus datos para gestionar tu cuenta de trabajo.
footer.privacy=Privacidad
