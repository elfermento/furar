furar:
  public-url: http://localhost:8080
  # Ningún test sae á rede: enderezos gardados (ADR-0023).
  geocoder:
    provider: fixed
  # Os IT piden desde 127.0.0.1 moito máis rápido ca unha persoa: sen límite por IP
  # (RateLimitFilterTest próbao).
  rate-limit:
    requests-per-minute: 0
    writes-per-minute: 0
  # «¿Es un concello?» activo nos IT (ADR-0042); MunicipalityJoinRequestDisabledIT próbaa sen ela.
  # O límite por IP próbase con X-Forwarded-For distinto en cada test.
  join-request:
    email: altas@example.org
  # Os IT non dependen da hora á que corren: sen o silencio nocturno da lista de espera dos eventos
  # (iguais, sen silencio; WaitlistClockTest proba a noite).
  event:
    waitlist-quiet-from: "00:00"
    waitlist-quiet-to: "00:00"
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
  test:
    context:
      cache:
        maxSize: 4
management:
  server:
    port: 0
logging:
  level:
    root: WARN
    gal.furar: INFO
    org.springframework.boot.test: WARN
